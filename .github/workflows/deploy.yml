name: Deploy loke.dev

permissions:
  contents: read

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'studio/**'
      - '.github/workflows/deploy-studio.yml'
      - '**/*.md'
  repository_dispatch:
    types: [sanity-content-update]
  workflow_dispatch:

concurrency:
  group: deploy-loke-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Check Cloudflare Worker configuration
        uses: loke-dev/flarecheck@v0.9.0

      - name: Build site
        env:
          VITE_SANITY_PROJECT_ID: ${{ secrets.VITE_SANITY_PROJECT_ID }}
          VITE_SANITY_DATASET: ${{ secrets.VITE_SANITY_DATASET }}
          VITE_SANITY_USE_CDN: 'false'
          GITHUB_OWNER: ${{ secrets.GITHUB_OWNER }}
          GITHUB_REPO: ${{ secrets.GITHUB_REPO }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ZONE_ID" && test -n "$CLOUDFLARE_API_TOKEN" || exit 0
          curl --fail-with-body -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

      - name: Smoke test public sitemap
        run: |
          set -euo pipefail
          sitemap=$(curl --fail --retry 3 --retry-all-errors --retry-delay 2 -sS "https://loke.dev/sitemap.xml")
          while IFS= read -r route; do
            test -n "$route" || continue
            curl --fail --retry 3 --retry-all-errors --retry-delay 2 -sS -o /dev/null "$route"
          done < <(printf '%s' "$sitemap" | sed -n 's#.*<loc>\(.*\)</loc>.*#\1#p')

      - name: Warm SSR routes
        run: |
          curl -sS -o /dev/null "https://loke.dev/search" || true
