name: Deploy loke.dev

permissions:
  contents: read

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'studio/**'
      - '.github/workflows/deploy-studio.yml'
      - '**/*.md'
  repository_dispatch:
    types: [sanity-content-update]
  workflow_dispatch:

concurrency:
  group: deploy-loke-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Check peer dependencies
        run: pnpm peers check

      - name: Run unit tests
        run: pnpm test

      - name: Check Cloudflare Worker configuration
        uses: loke-dev/flarecheck@v0.9.0

      - name: Build site
        env:
          VITE_SANITY_PROJECT_ID: ${{ secrets.VITE_SANITY_PROJECT_ID }}
          VITE_SANITY_DATASET: ${{ secrets.VITE_SANITY_DATASET }}
          VITE_SANITY_USE_CDN: 'false'
          GITHUB_OWNER: ${{ secrets.GITHUB_OWNER }}
          GITHUB_REPO: ${{ secrets.GITHUB_REPO }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke and accessibility tests
        env:
          BASE_URL: https://loke-dev.gitdash.workers.dev
        run: pnpm test:e2e

      - name: Run Lighthouse CI audit
        env:
          BASE_URL: https://loke-dev.gitdash.workers.dev
        run: pnpm audit:lighthouse

      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ZONE_ID" && test -n "$CLOUDFLARE_API_TOKEN" || exit 0
          curl --fail-with-body -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

      - name: Smoke test public sitemap
        run: |
          set -euo pipefail
          origin="https://loke-dev.gitdash.workers.dev"
          user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36 loke.dev deployment smoke test"
          sitemap=$(curl --fail --retry 3 --retry-all-errors --retry-delay 2 -A "$user_agent" -sS "$origin/sitemap.xml")
          export user_agent
          SITE_ORIGIN="$origin" node scripts/check-sitemap-canonicals.mjs
          for route in /robots.txt /rss.xml /manifest.json; do
            printf 'Checking %s%s\n' "$origin" "$route"
            curl --fail --retry 3 --retry-all-errors --retry-delay 2 -A "$user_agent" -sS -o /dev/null "$origin$route"
          done
          home_html=$(curl --fail --retry 3 --retry-all-errors --retry-delay 2 -A "$user_agent" -sS "$origin/")
          grep -Fq '<script async data-project-id="f08c2acd-2566-41d9-9af5-c34505ca3a1c" src="https://api.muroanalytics.com/muro.js"></script>' <<<"$home_html"
          manifest=$(curl --fail --retry 3 --retry-all-errors --retry-delay 2 -A "$user_agent" -sS "$origin/manifest.json")
          printf '%s' "$manifest" \
            | jq --exit-status '(.id == "/") and (.lang == "en") and (.scope == "/") and (.start_url == "/")' >/dev/null
          manifest_headers=$(curl --fail --retry 3 --retry-all-errors --retry-delay 2 -A "$user_agent" -sSI "$origin/manifest.json")
          printf '%s\n' "$manifest_headers" | grep -Fqi 'cache-control: public, max-age=3600, stale-while-revalidate=86400'
          favicon_headers=$(curl --fail --retry 3 --retry-all-errors --retry-delay 2 -A "$user_agent" -sSI "$origin/favicon.ico")
          printf '%s\n' "$favicon_headers" | grep -Fqi 'cache-control: public, max-age=86400, stale-while-revalidate=604800'
          for icon in android-chrome-192x192.png android-chrome-512x512.png; do
            icon_headers=$(curl --fail --retry 3 --retry-all-errors --retry-delay 2 -A "$user_agent" -sSI "$origin/$icon")
            printf '%s\n' "$icon_headers" | grep -Fqi 'cache-control: public, max-age=31536000, immutable'
          done
          for route in / /about /projects /tools; do
            printf 'Checking cache policy for %s%s\n' "$origin" "$route"
            headers=$(curl --fail --retry 3 --retry-all-errors --retry-delay 2 -A "$user_agent" -sSI "$origin$route")
            printf '%s\n' "$headers" | grep -Fqi 'cache-control: public, max-age=3600, stale-while-revalidate=86400'
            printf '%s\n' "$headers" | grep -Fqi 'stale-if-error=86400'
            printf '%s\n' "$headers" | grep -Fqi 'strict-transport-security: max-age=31536000; includeSubDomains'
          done
          redirect_headers=$(curl --fail --retry 3 --retry-all-errors --retry-delay 2 -A "$user_agent" -sSI "$origin/about/")
          printf '%s\n' "$redirect_headers" | grep -Eq '^HTTP/[0-9.]+ 308([[:space:]]|$)'
          printf '%s\n' "$redirect_headers" | grep -Fqi 'content-security-policy:'
          printf '%s\n' "$redirect_headers" | grep -Fqi 'x-content-type-options: nosniff'
          for route in / /about /projects /tools '/tools?smoke=1'; do
            printf 'Checking rendered HTML body for %s%s\n' "$origin" "$route"
            body=$(curl --fail --retry 3 --retry-all-errors --retry-delay 2 -A "$user_agent" -sS "$origin$route")
            if [[ "$body" != *'<html'* ]]; then
              echo "Canonical route did not return an HTML document: $origin$route"
              exit 1
            fi
            if [[ "$body" == *'Redirecting from'* ]]; then
              echo "Canonical route returned a redirect document: $origin$route"
              exit 1
            fi
            if [[ "$body" != *'<link rel="canonical"'* ]]; then
              echo "Canonical route is missing a canonical link: $origin$route"
              exit 1
            fi
            if [[ "$body" != *'property="og:title"'* ]]; then
              echo "Canonical route is missing an Open Graph title: $origin$route"
              exit 1
            fi
          done
          public_domain="https://loke.dev"
          for route in / /blog; do
            printf 'Checking public security headers for %s%s\n' "$public_domain" "$route"
            headers=$(curl --retry 3 --retry-all-errors --retry-delay 2 -A "$user_agent" -sSI "$public_domain$route" || true)
            if printf '%s\n' "$headers" | grep -Fqi 'strict-transport-security: max-age=31536000; includeSubDomains'; then
              continue
            fi
            if printf '%s\n' "$headers" | grep -Eq '^HTTP/[0-9.]+ 403([[:space:]]|$)'; then
              echo "Public-domain check skipped: Cloudflare returned 403 to this CI runner."
              continue
            fi
            echo "Public-domain security header check failed for $public_domain$route"
            exit 1
          done
          printf 'Checking %s/health\n' "$origin"
          health=$(curl --fail --retry 3 --retry-all-errors --retry-delay 2 -A "$user_agent" -sS "$origin/health")
          printf '%s' "$health" | jq --exit-status '.ok == true and .service == "loke.dev"' >/dev/null
          error_headers=$(curl --retry 3 --retry-all-errors --retry-delay 2 -A "$user_agent" -sSI "$origin/smoke-route-that-does-not-exist")
          printf '%s\n' "$error_headers" | grep -Eq '^HTTP/[0-9.]+ 404([[:space:]]|$)'
          printf '%s\n' "$error_headers" | grep -Fqi 'x-robots-tag: noindex, nofollow'
          printf '%s\n' "$error_headers" | grep -Fqi 'cache-control: public, max-age=0, s-maxage=300, stale-while-revalidate=86400, stale-if-error=86400'
          # The inner shell must expand $1, not the outer workflow shell.
          # shellcheck disable=SC2016
          printf '%s' "$sitemap" \
            | sed -n 's#.*<loc>\(.*\)</loc>.*#\1#p' \
            | sed "s#https://loke.dev#$origin#" \
            | xargs -r -n1 -P8 sh -c '
                printf "Checking %s\\n" "$1"
                curl --fail --retry 3 --retry-all-errors --retry-delay 2 -A "$user_agent" -sS -o /dev/null "$1"
              ' sh

      - name: Warm SSR routes
        run: |
          curl -sS -o /dev/null "https://loke.dev/search" || true
